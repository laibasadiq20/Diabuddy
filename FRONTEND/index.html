<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DiaBuddy — a calm, beautifully-made companion for living with diabetes. Track glucose, log meals, connect with community." />
    <title>DiaBuddy — Your Diabetes Companion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,900;1,400;1,600&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,300;1,9..40,400&family=Noto+Nastaliq+Urdu:wght@400..700&display=swap" rel="stylesheet" />
  </head>

  <body>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('diabuddy_theme');
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);

          var lang = localStorage.getItem('diabuddy_lang');
          if (lang !== 'en' && lang !== 'ur') lang = 'en';
          // Layout always LTR/English bidi — Urdu only changes copy + font.
          document.documentElement.setAttribute('lang', 'en');
          document.documentElement.setAttribute('dir', 'ltr');
          document.documentElement.setAttribute('data-lang', lang);
        } catch (e) {
          /* ignore — React providers will set these on mount */
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
